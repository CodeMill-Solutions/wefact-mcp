name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# Least privilege by default; the publish job opts back into what it needs.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm provenance: lets the job mint an OIDC token that npm
      # verifies, so the published tarball is cryptographically tied to this
      # repository, workflow and commit.
      id-token: write

    steps:
      # Actions are pinned to commit SHAs rather than tags. A tag can be moved
      # to point at different code — including by a compromised upstream — while
      # a SHA cannot. The trailing comment records the human-readable version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # npm only allows unpublishing within 72 hours, so everything CI checks on
      # a PR is checked again here against the exact tagged commit. `typecheck`
      # additionally covers `scripts/`, which the build config does not reach.
      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # A tag that disagrees with package.json means the wrong commit was
      # tagged; publishing it would ship the wrong version number.
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
